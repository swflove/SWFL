<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恋をしましょう - Helper</title>
    <style>
        /* 1. 書体をリュウミン（明朝体）に設定し、色を白と赤のみに制限 */
        body {
            background-color: #fff;
            color: #e60012; /* すべてのテキストを赤に */
            font-family: "A-OTF Ryumin Pr6N", "Ryumin", "リュウミン", "Hiragino Mincho ProN", "Yu Mincho", serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        #container { text-align: center; width: 80%; max-width: 600px; }
        
        h1 { font-size: 1.4rem; font-weight: normal; margin-bottom: 3rem; letter-spacing: 0.1em; }
        .info { font-size: 1.2rem; line-height: 2; margin-bottom: 2rem; letter-spacing: 0.05em; }
        .sub-info { font-size: 0.9rem; margin-top: 1rem; }

        /* 2. 丸を基調としたデザイン（アルファベットやタイマー用） */
        .circle-char {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background-color: #e60012;
            color: #fff;
            font-size: 4.5rem;
            margin: 1.5rem auto;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            transition: all 0.3s;
        }

        /* 3. ボタンは角丸（白と赤の反転） */
        button {
            background-color: #fff; 
            border: 1px solid #e60012; 
            color: #e60012;
            padding: 12px 40px;
            font-size: 1rem; 
            cursor: pointer; 
            transition: 0.3s;
            margin: 5px; 
            border-radius: 40px; /* 角丸設定 */
            font-family: inherit; /* ボタンもリュウミンに */
            letter-spacing: 0.1em;
        }
        button:hover { background-color: #e60012; color: #fff; }
        .hidden { display: none !important; }
        
        .button-group { margin-top: 1.5rem; }
    </style>
</head>
<body>

<div id="container">
    <div id="title-view">
        <h1 style="font-size: 2rem; margin-bottom: 4rem;">恋をしましょう</h1>
        <button onclick="showView('setup-view')">ゲームを始める</button>
    </div>

    <div id="setup-view" class="hidden">
        <h1>プレイヤー人数を選択</h1>
        <button onclick="startDealer(4)">4人</button>
        <button onclick="startDealer(5)">5人</button>
        <button onclick="startDealer(6)">6人</button>
    </div>

    <div id="dealer-view" class="hidden">
    </div>

    <div id="talk-view" class="hidden">
        <h1 id="theme-label">テーマ 1 / 5</h1>
        <div id="player-label" class="info">Player A さんの番</div>
        <div id="talk-timer" class="circle-char">30</div>
        <div class="button-group">
            <button id="talk-start-btn" onclick="startTalkTimer()">開始</button>
            <button id="talk-next-btn" onclick="nextTalk()">NEXT (スキップ)</button>
        </div>
    </div>

    <div id="inference-view" class="hidden">
        <h1>推理タイム</h1>
        <div class="info">
            砂時計をひっくり返し、<br>
            3分間のフリートークを始めてください。
        </div>
        <div class="button-group">
            <button onclick="showConfession()">予想を終える</button>
        </div>
        <div class="button-group">
            <button onclick="location.reload()">最初からやり直す</button>
        </div>
    </div>

    <div id="confession-view" class="hidden">
    </div>
</div>

<script>
    let players = [];
    let pairings = {};
    let numPlayers = 0;
    let currentDealerIdx = 0;
    let currentTheme = 1;
    let currentPlayerIndex = 0;
    let startPlayerOffset = 0;
    let timerInterval;

    const views = ['title-view', 'setup-view', 'dealer-view', 'talk-view', 'inference-view', 'confession-view'];
    
    function showView(id) {
        views.forEach(v => document.getElementById(v).classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    // ディーラー機能
    function startDealer(n) {
        numPlayers = n;
        players = Array.from({length: n}, (_, i) => String.fromCharCode(65 + i));
        
        let shuffled = [...players].sort(() => Math.random() - 0.5);
        pairings = {};
        for(let i=0; i<n; i++) {
            pairings[shuffled[i]] = shuffled[(i + 1) % n];
        }
        
        currentDealerIdx = 0;
        showTargetStep();
        showView('dealer-view');
    }

    function showTargetStep() {
        const p = players[currentDealerIdx];
        document.getElementById('dealer-view').innerHTML = `
            <h1>ターゲットの確認</h1>
            <div class="info">次は、${p} さんの番です</div>
            <div class="sub-info">他の方は画面を見ないでください</div>
            <br>
            <button onclick="revealTarget('${p}')">私は${p}さんです</button>
        `;
    }

    // アルファベットを丸背景の中に表示
    function revealTarget(p) {
        const target = pairings[p];
        document.getElementById('dealer-view').innerHTML = `
            <h1>ターゲットの確認</h1>
            <div class="info">${p}さんはこのゲーム中</div>
            <div class="circle-char">${target}</div>
            <div class="info">さんに恋をしましょう</div>
            <br>
            <button onclick="finishTargetStep()">確認しました</button>
        `;
    }

    function finishTargetStep() {
        currentDealerIdx++;
        if (currentDealerIdx < numPlayers) {
            showTargetStep();
        } else {
            document.getElementById('dealer-view').innerHTML = `
                <h1>準備完了</h1>
                <div class="info">全員の確認が終わりました。</div>
                <br>
                <button onclick="initTalk()">トーク開始</button>
            `;
        }
    }

    // トークタイマー機能
    function initTalk() {
        currentTheme = 1;
        startPlayerOffset = 0;
        showView('talk-view');
        prepareTalkTurn();
    }

    function prepareTalkTurn() {
        clearInterval(timerInterval);
        let actualPlayerIdx = (startPlayerOffset + currentPlayerIndex) % numPlayers;
        
        document.getElementById('theme-label').innerText = `テーマ ${currentTheme} / 5`;
        document.getElementById('player-label').innerText = `Player ${players[actualPlayerIdx]} さんの番`;
        
        const timerDisplay = document.getElementById('talk-timer');
        timerDisplay.innerText = "30";
        // タイマーの初期色（赤背景・白文字）
        timerDisplay.style.backgroundColor = '#e60012';
        timerDisplay.style.color = '#fff';
        timerDisplay.style.border = 'none';
        
        document.getElementById('talk-start-btn').classList.remove('hidden');
    }

    function startTalkTimer() {
        document.getElementById('talk-start-btn').classList.add('hidden');
        startCountdown(30, 'talk-timer', () => {
            // 時間切れで色を反転（白背景・赤文字・赤枠）
            const timerDisplay = document.getElementById('talk-timer');
            timerDisplay.style.backgroundColor = '#fff';
            timerDisplay.style.color = '#e60012';
            timerDisplay.style.border = '2px solid #e60012';
        });
    }

    function nextTalk() {
        currentPlayerIndex++;
        if (currentPlayerIndex < numPlayers) {
            prepareTalkTurn();
        } else {
            currentTheme++;
            if (currentTheme <= 5) {
                startPlayerOffset = (startPlayerOffset + 1) % numPlayers;
                currentPlayerIndex = 0;
                prepareTalkTurn();
            } else {
                showView('inference-view');
            }
        }
    }

    // 告白タイム機能（最後の人のアルファベットも丸デザインで表示）
    function showConfession() {
        clearInterval(timerInterval);
        const lastPlayer = players[numPlayers - 1];
        
        document.getElementById('confession-view').innerHTML = `
            <h1>告白タイム</h1>
            <div class="info">
                Aさんから順に告白しましょう。<br><br>
                最後は
            </div>
            <div class="circle-char" style="width: 80px; height: 80px; font-size: 2.5rem; margin: 1rem auto;">${lastPlayer}</div>
            <div class="info">
                さんです。<br><br>
                告白を終えた時点で、<br>
                最もポイントの多いプレイヤーの勝利です。
            </div>
            <div class="button-group">
                <button onclick="location.reload()">次のゲームへ</button>
            </div>
        `;
        showView('confession-view');
    }

    function startCountdown(seconds, elementId, onComplete) {
        clearInterval(timerInterval);
        let timeLeft = seconds;
        const display = document.getElementById(elementId);
        display.innerText = timeLeft;

        timerInterval = setInterval(() => {
            timeLeft--;
            display.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                if (onComplete) onComplete();
            }
        }, 1000);
    }
</script>
</body>
</html>
