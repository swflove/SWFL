<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恋をしましょう - Helper</title>
    <style>
        /* 1. 背景を赤に、互いに接する大きさの丸パターンを配置 */
        body {
            background-color: #e60012;
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.12) 50%, transparent 50%);
            background-size: 80px 80px; /* 丸のサイズを大きく変更 */
            background-position: center;
            font-family: "A-OTF Ryumin Pr6N", "Ryumin", "リュウミン", "Hiragino Mincho ProN", "Yu Mincho", serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 2. 白を抜いた領域 */
        #container { 
            background-color: #fff;
            color: #e60012;
            text-align: center; 
            width: 88%; 
            max-width: 450px; 
            min-height: 65vh;
            border-radius: 60px; 
            padding: 3rem 2rem;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(160, 0, 0, 0.4);
            position: relative;
            z-index: 1;
        }
        
        h1 { font-size: 1.4rem; font-weight: normal; margin-bottom: 2rem; letter-spacing: 0.1em; line-height: 1.5; }
        .info { font-size: 1.2rem; line-height: 2; margin-bottom: 1.5rem; letter-spacing: 0.05em; }
        .sub-info { font-size: 0.9rem; color: #e60012; opacity: 0.7; margin-top: 1rem; }

        /* 3. ターゲットやタイマー用の大きな丸 */
        .circle-char {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background-color: #e60012;
            color: #fff;
            font-size: 4.5rem;
            margin: 1.5rem auto;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        /* 4. 文中のアルファベット用の小さな丸 */
        .inline-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #e60012;
            color: #fff;
            font-size: 1.2rem;
            margin: 0 6px;
            vertical-align: middle;
        }

        /* 5. ボタン */
        button {
            background-color: #e60012; 
            border: 2px solid #e60012; 
            color: #fff;
            padding: 12px 40px;
            font-size: 1rem; 
            cursor: pointer; 
            transition: 0.3s;
            margin: 8px; 
            border-radius: 40px; 
            font-family: inherit;
            letter-spacing: 0.1em;
        }
        button:hover { background-color: #fff; color: #e60012; }
        .hidden { display: none !important; }
        
        .button-group { margin-top: 1rem; }
    </style>
</head>
<body>

<div id="container">
    <div id="title-view">
        <h1 style="font-size: 2rem; margin-bottom: 3rem;">恋をしましょう</h1>
        <button onclick="showView('setup-view')">ゲームを始める</button>
    </div>

    <div id="setup-view" class="hidden">
        <h1 style="margin-bottom: 3rem;">プレイヤー人数を選択</h1>
        <button onclick="startDealer(4)">4人</button>
        <button onclick="startDealer(5)">5人</button>
        <button onclick="startDealer(6)">6人</button>
    </div>

    <div id="dealer-view" class="hidden">
    </div>

    <div id="talk-view" class="hidden">
        <h1 id="theme-label">テーマ 1 / 5</h1>
        <div id="player-label" class="info"></div>
        <div id="talk-timer" class="circle-char">30</div>
        <div class="button-group">
            <button id="talk-start-btn" onclick="startTalkTimer()">開始</button>
            <button id="talk-next-btn" onclick="nextTalk()">NEXT (スキップ)</button>
        </div>
    </div>

    <div id="inference-view" class="hidden">
        <h1>推理タイム</h1>
        <div id="inference-timer" class="circle-char">180</div>
        <div class="button-group">
            <button id="inf-start-btn" onclick="startInferenceTimer()">開始</button>
            <button id="inf-stop-btn" class="hidden" onclick="stopInferenceTimer()">一時停止</button>
            <button onclick="showConfession()">スキップ</button>
        </div>
        <div class="button-group">
            <button onclick="location.reload()" style="background-color: #fff; color: #e60012; font-size: 0.9rem; padding: 8px 24px;">最初からやり直す</button>
        </div>
    </div>

    <div id="confession-view" class="hidden">
    </div>
</div>

<script>
    let players = [];
    let pairings = {};
    let numPlayers = 0;
    let currentDealerIdx = 0;
    let currentTheme = 1;
    let currentPlayerIndex = 0;
    let startPlayerOffset = 0;
    let timerInterval;
    let inferenceTimeLeft = 180;

    const views = ['title-view', 'setup-view', 'dealer-view', 'talk-view', 'inference-view', 'confession-view'];
    
    function showView(id) {
        views.forEach(v => document.getElementById(v).classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function startDealer(n) {
        numPlayers = n;
        players = Array.from({length: n}, (_, i) => String.fromCharCode(65 + i));
        
        let shuffled = [...players].sort(() => Math.random() - 0.5);
        pairings = {};
        for(let i=0; i<n; i++) {
            pairings[shuffled[i]] = shuffled[(i + 1) % n];
        }
        
        currentDealerIdx = 0;
        showTargetStep();
        showView('dealer-view');
    }

    function showTargetStep() {
        const p = players[currentDealerIdx];
        document.getElementById('dealer-view').innerHTML = `
            <h1>ターゲットの確認</h1>
            <div class="info">次は、<span class="inline-circle">${p}</span> さんの番です</div>
            <div class="sub-info">他の方は画面を見ないでください</div>
            <br>
            <button onclick="revealTarget('${p}')">私は ${p} さんです</button>
        `;
    }

    function revealTarget(p) {
        const target = pairings[p];
        document.getElementById('dealer-view').innerHTML = `
            <h1>ターゲットの確認</h1>
            <div class="info"><span class="inline-circle">${p}</span> さんはこのゲーム中</div>
            <div class="circle-char">${target}</div>
            <div class="info">さんに恋をしましょう</div>
            <br>
            <button onclick="finishTargetStep()">確認しました</button>
        `;
    }

    function finishTargetStep() {
        currentDealerIdx++;
        if (currentDealerIdx < numPlayers) {
            showTargetStep();
        } else {
            document.getElementById('dealer-view').innerHTML = `
                <h1 style="margin-bottom: 3rem;">準備完了</h1>
                <div class="info">全員の確認が終わりました。</div>
                <br>
                <button onclick="initTalk()">トーク開始</button>
            `;
        }
    }

    function initTalk() {
        currentTheme = 1;
        startPlayerOffset = 0;
        showView('talk-view');
        prepareTalkTurn();
    }

    function prepareTalkTurn() {
        clearInterval(timerInterval);
        let actualPlayerIdx = (startPlayerOffset + currentPlayerIndex) % numPlayers;
        
        document.getElementById('theme-label').innerText = `テーマ ${currentTheme} / 5`;
        document.getElementById('player-label').innerHTML = `Player <span class="inline-circle">${players[actualPlayerIdx]}</span> さんの番`;
        
        const timerDisplay = document.getElementById('talk-timer');
        timerDisplay.innerText = "30";
        timerDisplay.style.backgroundColor = '#e60012';
        timerDisplay.style.color = '#fff';
        timerDisplay.style.border = 'none';
        
        document.getElementById('talk-start-btn').classList.remove('hidden');
    }

    function startTalkTimer() {
        document.getElementById('talk-start-btn').classList.add('hidden');
        startCountdown(30, 'talk-timer', () => {
            const timerDisplay = document.getElementById('talk-timer');
            timerDisplay.style.backgroundColor = '#fff';
            timerDisplay.style.color = '#e60012';
            timerDisplay.style.border = '4px solid #e60012';
        });
    }

    function nextTalk() {
        currentPlayerIndex++;
        if (currentPlayerIndex < numPlayers) {
            prepareTalkTurn();
        } else {
            currentTheme++;
            if (currentTheme <= 5) {
                startPlayerOffset = (startPlayerOffset + 1) % numPlayers;
                currentPlayerIndex = 0;
                prepareTalkTurn();
            } else {
                prepareInference();
            }
        }
    }

    // 推理タイマーの準備
    function prepareInference() {
        clearInterval(timerInterval);
        inferenceTimeLeft = 180;
        document.getElementById('inference-timer').innerText = inferenceTimeLeft;
        document.getElementById('inference-timer').style.backgroundColor = '#e60012';
        document.getElementById('inference-timer').style.color = '#fff';
        document.getElementById('inference-timer').style.border = 'none';
        
        document.getElementById('inf-start-btn').classList.remove('hidden');
        document.getElementById('inf-stop-btn').classList.add('hidden');
        showView('inference-view');
    }

    function startInferenceTimer() {
        document.getElementById('inf-start-btn').classList.add('hidden');
        document.getElementById('inf-stop-btn').classList.remove('hidden');
        
        clearInterval(timerInterval);
        const display = document.getElementById('inference-timer');
        
        timerInterval = setInterval(() => {
            inferenceTimeLeft--;
            display.innerText = inferenceTimeLeft;
            if (inferenceTimeLeft <= 0) {
                clearInterval(timerInterval);
                display.style.backgroundColor = '#fff';
                display.style.color = '#e60012';
                display.style.border = '4px solid #e60012';
                document.getElementById('inf-stop-btn').classList.add('hidden');
            }
        }, 1000);
    }

    function stopInferenceTimer() {
        clearInterval(timerInterval);
        document.getElementById('inf-stop-btn').classList.add('hidden');
        document.getElementById('inf-start-btn').classList.remove('hidden');
    }

    function showConfession() {
        clearInterval(timerInterval);
        const lastPlayer = players[numPlayers - 1];
        
        document.getElementById('confession-view').innerHTML = `
            <h1 style="margin-bottom: 3rem;">告白タイム</h1>
            <div class="info">
                Aさんから順に告白しましょう。<br><br>
                最後は
            </div>
            <div class="circle-char" style="width: 80px; height: 80px; font-size: 2.5rem; margin: 1rem auto;">${lastPlayer}</div>
            <div class="info">
                さんです。<br><br>
                告白を終えた時点で、<br>
                最もポイントの多いプレイヤーの勝利です。
            </div>
            <div class="button-group">
                <button onclick="location.reload()">次のゲームへ</button>
            </div>
        `;
        showView('confession-view');
    }

    function startCountdown(seconds, elementId, onComplete) {
        clearInterval(timerInterval);
        let timeLeft = seconds;
        const display = document.getElementById(elementId);
        display.innerText = timeLeft;

        timerInterval = setInterval(() => {
            timeLeft--;
            display.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                if (onComplete) onComplete();
            }
        }, 1000);
    }
</script>
</body>
</html>
